# SLURM Configuration
slurm:
  script_file: "disaggr_torch.slurm"
  partition: "batch_long"
  account: "coreai_comparch_trtllm"
  job_time: "24:00:00"
  job_name: "coreai_comparch_trtllm-benchmark"
  extra_args: "--gres=gpu:4" # Cluster specific arguments, e.g. "--gres=gpu:4 --exclude=node1,node2"
  set_segment: true # Optional: whether to set the segment for the job
  numa_bind: true # Only enable for GB200/GB300 NVL72

# Benchmark Mode
benchmark:
  mode: "e2e"  # Options: e2e, gen_only, gen_only_no_context
  use_nv_sa_benchmark: true  # Whether to use NVIDIA SA benchmark script
  multi_round: 8  # Number of benchmark rounds
  benchmark_ratio: 1.0  # Benchmark ratio
  streaming: true  # Enable streaming mode
  concurrency_list: "8"
  input_length: 131072  # Input sequence length
  output_length: 128 # Output sequence length
  dataset_file: "<dataset_file>"

# Hardware Configuration
hardware:
  gpus_per_node: 4  # Modify this with your hardware configuration
  num_ctx_servers: 1  # Number of context servers
  num_gen_servers: 1  # Number of generation servers

# Environment Configuration
environment:
  container_mount: "/lustre/fsw/portfolios/coreai/users/dominicw:/lustre/fsw/portfolios/coreai/users/dominicw,/lustre/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/common/DeepSeek-R1-0528-FP4-V2:/DeepSeek-R1-0528-FP4-V2,/lustre/fsw/portfolios/coreai/projects/coreai_comparch_trtllm/common/DeepSeek-R1/DeepSeek-R1:/DeepSeek-R1"  # Format: path1:path1,path2:path2
  container_image: "/lustre/fsw/portfolios/coreai/users/dominicw/trt_llm_aarch64_13rc5_p1.sqsh"
  model_path: "/DeepSeek-R1-0528-FP4-V2"
  trtllm_repo: "/lustre/fsw/portfolios/coreai/users/dominicw/TensorRT-LLM"
  build_wheel: false  # Don't build the wheel when launching multiple jobs
  cuda_architectures: "100-real"  # Optional CUDA architectures to build for (e.g. "90-real;100-real"). If empty, builds for all architectures
  trtllm_wheel_path: "/lustre/fsw/portfolios/coreai/users/dominicw/TensorRT-LLM/build/tensorrt_llm-1.3.0rc7-cp312-cp312-linux_aarch64.whl"  # Path to pre-built TensorRT-LLM wheel. If provided, install from this wheel instead
  work_dir: "/lustre/fsw/portfolios/coreai/users/dominicw/TensorRT-LLM/examples/disaggregated/slurm/benchmark"
  worker_env_var: "TLLM_LOG_LEVEL=INFO TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_WORKER_DISABLE_GC=1 TRTLLM_ENABLE_PDL=1 ENROOT_ALLOW_DEV=yes HF_HUB_OFFLINE=1 HF_HOME=/tmp/hf_home FLASHINFER_WORKSPACE_BASE=/tmp PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True"
  server_env_var: "TRTLLM_SERVER_DISABLE_GC=1"

# Profiling Configuration
profiling:
  nsys_on: false  # Set to true to enable profiling
  ctx_profile_range: "1-40"  # Set TLLM_PROFILE_START_STOP for ctx workers
  gen_profile_range: "400-550"  # Set TLLM_PROFILE_START_STOP for gen workers

# Accuracy Configuration
accuracy:
  enable_accuracy_test: false  # Set to true to enable accuracy evaluation
  tasks:
    gsm8k:
      model: "local-completions"  # Model type for lm_eval
      model_args_extra: "num_concurrent=512,max_retries=3,tokenized_requests=false,timeout=7200,max_gen_toks=16384"
      extra_kwargs:
        trust_remote_code: true

worker_config:
  gen:
    enable_autotuner: false # Disable autotuner to verify the OOM bug
    checkpoint_format: "HF"
    tensor_parallel_size: 8
    moe_expert_parallel_size: 8
    enable_attention_dp: false
    enable_lm_head_tp_in_adp: false
    pipeline_parallel_size: 1
    context_parallel_size: 1
    # Uncomment this section to enable context parallelism.
    # cp_config:
    #   cp_type: "HELIX"
    #   tokens_per_block: 32  # must match kv_config.tokens_per_block.
    max_batch_size: 1
    max_num_tokens: 32
    max_seq_len: 131200
    cuda_graph_config:
      enable_padding: true
      batch_sizes:
      - 1
    print_iter_log: true
    trust_remote_code: true
    kv_cache_config:
      enable_block_reuse: false
      tokens_per_block: 32
      free_gpu_memory_fraction: 0.8
      dtype: fp8
    moe_config:
      backend: TRTLLM
      use_low_precision_moe_combine: true
      # max_num_tokens: 8192
      # load_balancer:
      #   num_slots: 0
    cache_transceiver_config:
      max_tokens_in_buffer: 131072
      backend: DEFAULT
    stream_interval: 100
    num_postprocess_workers: 8
    # speculative_config: # when mtp_size is 0, remove this section.
    #   decoding_type: MTP
    #   num_nextn_predict_layers: 1
  ctx:
    enable_autotuner: false # Disable autotuner to verify the OOM bug
    checkpoint_format: "HF"
    max_batch_size: 1
    max_num_tokens: 131080
    max_seq_len: 131200
    tensor_parallel_size: 8
    context_parallel_size: 1
    moe_expert_parallel_size: 8
    enable_attention_dp: true
    pipeline_parallel_size: 1
    print_iter_log: true
    trust_remote_code: true
    cuda_graph_config: null
    disable_overlap_scheduler: true
    enable_chunked_prefill: false # test subject
    moe_config:
      backend: TRTLLM
      use_low_precision_moe_combine: true
      # max_num_tokens: 8192
      # load_balancer:
      #   num_slots: 0
    kv_cache_config:
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.2
      dtype: fp8
    cache_transceiver_config:
      max_tokens_in_buffer: 131072
      backend: DEFAULT
    # speculative_config: # when mtp_size is 0, remove this section.
    #   decoding_type: MTP
    #   num_nextn_predict_layers: 3
